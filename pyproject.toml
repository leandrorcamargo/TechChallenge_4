[project]
name = "voc-rag"
version = "0.1.0"
description = "Tech Challenge Fase 4 — Voice of Customer Intelligence com RAG (Olist)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # LLM / orquestração
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "chromadb>=0.5",
    # Recuperação / rerank
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "rank-bm25>=0.2.2",
    # Dados
    "pandas>=2.2",
    "pyarrow>=16",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    # Extração do Ollama portátil no Linux (.tar.zst)
    "zstandard>=0.22",
    # Interface
    "streamlit>=1.38",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

# Torch CPU (Windows/Linux): o rerank/embedding da consulta é leve e o wheel CPU
# tem ~200 MB contra ~2,5 GB do CUDA. A GPU fica livre para o Ollama.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
